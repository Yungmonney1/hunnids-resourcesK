<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/hunnids%20shape%20files/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/hunnids%20shape%20files/favicon-180.png">
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "41faa7d6bbb0425a99de71b7d1bb3deb"}'></script><!-- End Cloudflare Web Analytics -->
  <title>hunnids*</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #eef1f5;
      --bg-card: rgba(255,255,255,0.6);
      --bg-hover: rgba(255,255,255,0.85);
      --border: rgba(255,255,255,0.55);
      --border-hover: rgba(140,150,165,0.35);
      --text-primary: #2c313a;
      --text-secondary: #6b7280;
      --text-muted: #a4acb8;
      --brown: #3a3f4a;
      --brown-dim: #21242c;
      --brown-light: #707a8a;
      --shadow-soft: 0 8px 30px rgba(40,45,60,0.08);
      --shadow-pop: 0 14px 40px rgba(40,45,60,0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--border-hover) transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    a { text-decoration: none; color: inherit; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(173,196,230,0.55) 0%, transparent 45%),
        radial-gradient(circle at 88% 18%, rgba(210,190,230,0.40) 0%, transparent 45%),
        radial-gradient(circle at 30% 85%, rgba(180,220,215,0.40) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(230,200,200,0.30) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    body, body * {
      transition: background-color 0.35s ease, border-color 0.35s ease, color 0.25s ease;
    }
    body.dark-mode {
      --bg: #0f1117;
      --bg-card: rgba(22,27,40,0.75);
      --bg-hover: rgba(30,36,54,0.9);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text-primary: #e8eaf0;
      --text-secondary: #8892a4;
      --text-muted: #4a5268;
      --brown: #8ba0c4;
      --brown-dim: #c4d4f0;
      --brown-light: #5a7aaa;
      --shadow-soft: 0 8px 30px rgba(0,0,0,0.3);
      --shadow-pop: 0 14px 40px rgba(0,0,0,0.5);
    }

    /* ── layout shell: icon rail + main column ── */
    .shell { display: flex; min-height: 100vh; }

    .rail {
      width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
      gap: 10px; padding: 20px 0; background: var(--bg-card); backdrop-filter: blur(16px) saturate(150%);
      border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh;
    }
    .rail-brand { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 18px; color: var(--brown-dim); margin-bottom: 10px; }
    .rail-icon {
      width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); transition: all 0.15s; position: relative;
    }
    .rail-icon:hover { background: var(--bg-hover); color: var(--brown-dim); }
    .rail-icon.active { background: var(--brown-dim); color: #fff; }
    .rail-spacer { flex: 1; }
    .rail-icon.discord-icon { color: #5865F2; }

    .main-col { flex: 1; min-width: 0; padding: 40px 48px 90px; max-width: 1400px; margin: 0 auto; }
    .hub-greeting { font-family: 'Quicksand', sans-serif; font-size: 38px; font-weight: 700; color: var(--brown-dim); margin-bottom: 6px; letter-spacing: -0.5px; }
    .hub-greeting span { color: var(--brown-light); }
    .hub-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }

    .stat-pills { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-pill {
      display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 30px;
      background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border);
      font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow-soft);
    }
    .stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .stat-pill .num { color: var(--brown-dim); }

    /* ── hero / spotlight carousel ── */
    .hero {
      position: relative; border-radius: 28px; overflow: hidden; height: 420px;
      background: linear-gradient(135deg, #7f9cd4, #a893d8); box-shadow: var(--shadow-pop); margin-bottom: 18px;
    }
    .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 0.5s ease; }
    .hero-bg.visible { opacity: 1; }
    .hero-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,12,20,0.8), rgba(10,12,20,0.15) 55%, transparent 80%); }
    .hero-content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px 40px; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #fff; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 14px; background: rgba(230,103,47,0.85); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 20px;
    }
    .hero-pulse { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulseDot 1.6s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .hero-title { font-family: 'Quicksand', sans-serif; font-size: 40px; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.35); margin-bottom: 8px; letter-spacing: -0.5px; }
    .hero-meta { font-size: 13.5px; color: rgba(255,255,255,0.9); margin-bottom: 20px; }
    .hero-actions { display: flex; gap: 10px; }
    .hero-btn {
      padding: 11px 24px; border-radius: 24px; font-weight: 700; font-size: 13.5px; border: none; cursor: pointer;
    }
    .hero-btn--primary { background: #fff; color: var(--brown-dim); }
    .hero-btn--ghost { background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.4); }
    .hero-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 36px; height: 36px;
      border-radius: 50%; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4);
      color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .hero-arrow:hover { background: rgba(255,255,255,0.4); }
    .hero-arrow-left { left: 14px; }
    .hero-arrow-right { right: 14px; }
    .hero-dots { position: absolute; bottom: 14px; right: 20px; display: flex; gap: 6px; z-index: 2; }
    .hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
    .hero-dot.active { width: 18px; border-radius: 3px; background: #fff; }

    /* ── horizontal scroll strip ── */
    .strip-label {
      display: flex; align-items: center; gap: 8px; font-family: 'Quicksand', sans-serif; font-size: 16px; font-weight: 700;
      color: var(--brown-dim); margin: 32px 0 14px;
    }
    .strip-label::before { content: ''; width: 4px; height: 16px; border-radius: 3px; background: #e6672f; }
    .strip-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
    .strip-card {
      flex-shrink: 0; width: 190px; border-radius: 18px; overflow: hidden; background: var(--bg-card);
      border: 1px solid var(--border); box-shadow: var(--shadow-soft); cursor: pointer; transition: transform 0.15s, background-color 0.35s;
    }
    .strip-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-pop); }
    .strip-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .strip-card-info { padding: 10px 12px; font-size: 12px; }
    .strip-card-user { font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .strip-card-stats { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; margin-top: 3px; }

    /* ── lower split: continue editing + widget stack ── */
    .lower-split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 28px; align-items: start; }
    @media (max-width: 900px) { .lower-split { grid-template-columns: 1fr; } }

    .ce-mini-card {
      background: var(--bg-card); backdrop-filter: blur(14px) saturate(150%); border: 1px solid var(--border);
      border-radius: 20px; padding: 18px; box-shadow: var(--shadow-soft);
    }
    .ce-mini-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .ce-mini-row:last-child { border-bottom: none; }
    .ce-mini-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; text-transform: uppercase;
      color: var(--brown-light); background: var(--bg-hover); border: 1px solid var(--border-hover);
      border-radius: 6px; padding: 3px 6px; flex-shrink: 0;
    }
    .ce-mini-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .widget-stack { display: flex; flex-direction: column; gap: 14px; }
    .w-card {
      border-radius: 20px; background: var(--bg-card); backdrop-filter: blur(14px) saturate(150%);
      border: 1px solid var(--border); box-shadow: var(--shadow-soft); padding: 16px;
    }
    .w-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--brown-light); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .discord-online-row { display: flex; align-items: center; gap: 8px; }
    .discord-btn { display: block; margin-top: 10px; text-align: center; padding: 9px; border-radius: 12px; background: #5865F2; color: #fff; font-weight: 700; font-size: 12.5px; }
    .tip-text, .plugin-text { font-size: 12.5px; }
    .plugin-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }

    .toggle-row { display: flex; gap: 8px; margin-top: 4px; }
    .rail-toggle {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border-hover); background: var(--bg-hover);
      color: var(--brown-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; overflow: visible;
    }

    @media (max-width: 700px) {
      .rail { display: none; }
      .main-col { padding: 24px 16px 60px; }
      .hero { height: 240px; }
      .hero-title { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="shell">
  <nav class="rail">
    <div class="rail-brand">*</div>
    <a class="rail-icon active" href="index.html" title="Home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </a>
    <a class="rail-icon" href="resources.html" title="Resources">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a class="rail-icon" href="edit-wall.html" title="Edit Wall">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </a>
    <a class="rail-icon discord-icon" href="https://discord.gg/AcuUU2zpdD" target="_blank" title="Join Discord">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.3 5.3A17.6 17.6 0 0 0 15.9 4l-.3.6a12.9 12.9 0 0 1 3.7 1.4 15.5 15.5 0 0 0-13.2 0 12 12 0 0 1 3.7-1.4L9.5 4a17.5 17.5 0 0 0-4.4 1.3C2 9.6 1.3 13.8 1.6 18a17.7 17.7 0 0 0 5.3 2.6l.8-1.2a11.6 11.6 0 0 1-1.9-.9l.5-.4a12.6 12.6 0 0 0 10.8 0l.5.4a11.6 11.6 0 0 1-1.9.9l.8 1.2A17.6 17.6 0 0 0 22 18c.4-4.8-.8-9-3.7-12.7ZM8.7 15.4c-.9 0-1.7-.9-1.7-1.9s.7-1.9 1.7-1.9 1.7.9 1.7 1.9-.8 1.9-1.7 1.9Zm6.5 0c-.9 0-1.7-.9-1.7-1.9s.7-1.9 1.7-1.9 1.7.9 1.7 1.9-.7 1.9-1.7 1.9Z"/></svg>
    </a>
    <div class="rail-spacer"></div>
    <button class="rail-icon rail-toggle" onclick="toggleDark()" id="dark-toggle" title="Toggle dark mode">
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5A8.5 8.5 0 1 1 11.5 4a6.5 6.5 0 0 0 8.5 8.5z"/></svg>
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
    </button>
    <button class="rail-icon rail-toggle" onclick="toggleMusic()" id="music-toggle" title="Now playing">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    </button>
  </nav>

  <div class="main-col">
    <div class="hub-greeting">Welcome back<span>*</span></div>
    <div class="hub-sub">Everything hunnids, all in one place.</div>

    <div class="stat-pills" id="stat-pills">
      <div class="stat-pill"><span class="dot" style="background:#3ba55c"></span> <span class="num" id="pill-online">—</span> online</div>
      <div class="stat-pill"><span class="dot" style="background:#e6672f"></span> <span class="num" id="pill-tutorials">—</span> tutorials</div>
      <div class="stat-pill"><span class="dot" style="background:#7f9cd4"></span> <span class="num" id="pill-plugins">—</span> plugins</div>
    </div>

    <!-- Hero: Editor Spotlight carousel -->
    <div class="hero" id="hero">
      <div class="hero-bg" id="hero-bg-a"></div>
      <div class="hero-bg" id="hero-bg-b"></div>
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <div class="hero-eyebrow"><span class="hero-pulse"></span> Editor Spotlight</div>
        <div class="hero-title" id="hero-title">Loading...</div>
        <div class="hero-meta" id="hero-meta"></div>
        <div class="hero-actions">
          <button class="hero-btn hero-btn--primary" onclick="location.href='edit-wall.html'">View Post</button>
          <button class="hero-btn hero-btn--ghost" onclick="location.href='edit-wall.html'">Visit Edit Wall</button>
        </div>
      </div>
      <div class="hero-arrow hero-arrow-left" onclick="heroPrev()">‹</div>
      <div class="hero-arrow hero-arrow-right" onclick="heroNext()">›</div>
      <div class="hero-dots" id="hero-dots"></div>
    </div>

    <div class="strip-label">Fresh off the wall</div>
    <div class="strip-row" id="strip-row">
      <div class="strip-card"><div style="height:100px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:11px;">loading...</div></div>
    </div>

    <div class="lower-split">
      <div class="ce-mini-card">
        <div class="w-label">// continue editing</div>
        <div id="ce-mini-list"><div class="ce-mini-row" style="color:var(--text-muted)">Nothing yet - go watch a tutorial!</div></div>
      </div>

      <div class="widget-stack">
        <div class="w-card">
          <div class="w-label">// join the server</div>
          <div id="discord-widget-hub">
            <div class="discord-online-row"><span style="width:7px;height:7px;border-radius:50%;background:var(--text-muted);"></span> loading...</div>
          </div>
        </div>
        <div class="w-card">
          <div class="w-label">// tip of the day</div>
          <div class="tip-text" id="tip-text">Loading...</div>
        </div>
        <a class="w-card" href="resources.html" id="plugin-card">
          <div class="w-label">// featured plugin</div>
          <div class="plugin-name" id="plugin-name">Loading...</div>
          <div class="plugin-text" id="plugin-text"></div>
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('hunnids-theme', isDark ? 'dark' : 'light');
    setThemeIcon(isDark);
  }
  function setThemeIcon(isDark) {
    const btn = document.getElementById('dark-toggle');
    if (!btn) return;
    btn.querySelector('.theme-icon--moon').style.display = isDark ? 'none' : 'block';
    btn.querySelector('.theme-icon--sun').style.display = isDark ? 'block' : 'none';
  }
  if (localStorage.getItem('hunnids-theme') === 'dark') {
    document.body.classList.add('dark-mode');
    setThemeIcon(true);
  }
  function toggleMusic() {
    if (window.HunnidsMiniplayer) window.HunnidsMiniplayer.toggle();
  }

  const API_BASE = 'https://hunnids-discord-bot.onrender.com';
  const TOKEN_KEY = 'hunnids_token';
  const token = localStorage.getItem(TOKEN_KEY);

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ── Hero carousel: top 5 most recent Edit Wall posts ──
  let heroPosts = [];
  let heroIndex = 0;
  let heroTimer = null;
  let heroActiveLayer = 'a';

  function renderHero() {
    if (heroPosts.length === 0) return;
    const post = heroPosts[heroIndex];

    const showingEl = document.getElementById(`hero-bg-${heroActiveLayer}`);
    const nextLayer = heroActiveLayer === 'a' ? 'b' : 'a';
    const hiddenEl = document.getElementById(`hero-bg-${nextLayer}`);

    hiddenEl.style.backgroundImage = `url(${post.image_url})`;
    // Force the browser to register the new image before fading it in,
    // otherwise the opacity transition can fire before the image loads.
    requestAnimationFrame(() => {
      hiddenEl.classList.add('visible');
      showingEl.classList.remove('visible');
    });
    heroActiveLayer = nextLayer;

    document.getElementById('hero-title').textContent = post.username || 'unknown';
    document.getElementById('hero-meta').textContent = `♥ ${post.like_count} · 💬 ${post.comment_count}`;
    document.getElementById('hero-dots').innerHTML = heroPosts.map((_, i) =>
      `<div class="hero-dot ${i === heroIndex ? 'active' : ''}" onclick="heroGoTo(${i})"></div>`
    ).join('');
  }
  function heroGoTo(i) { heroIndex = i; renderHero(); resetHeroTimer(); }
  function heroNext() { heroIndex = (heroIndex + 1) % heroPosts.length; renderHero(); resetHeroTimer(); }
  function heroPrev() { heroIndex = (heroIndex - 1 + heroPosts.length) % heroPosts.length; renderHero(); resetHeroTimer(); }
  function resetHeroTimer() {
    clearInterval(heroTimer);
    if (heroPosts.length > 1) heroTimer = setInterval(heroNext, 6000);
  }

  fetch(`${API_BASE}/api/posts?offset=0`)
    .then(r => r.json())
    .then(data => {
      heroPosts = (data.posts || []).slice(0, 5);
      if (heroPosts.length === 0) {
        document.getElementById('hero-title').textContent = 'Nothing posted yet';
        document.getElementById('hero-meta').textContent = 'be the first on the Edit Wall';
        document.querySelector('.hero-arrow-left').style.display = 'none';
        document.querySelector('.hero-arrow-right').style.display = 'none';
        return;
      }
      renderHero();
      resetHeroTimer();

      // Fresh off the wall strip
      const strip = document.getElementById('strip-row');
      strip.innerHTML = heroPosts.map(p => `
        <div class="strip-card" onclick="location.href='edit-wall.html'">
          <img src="${p.image_url}" alt="" loading="lazy" />
          <div class="strip-card-info">
            <div class="strip-card-user">${escapeHtml(p.username || 'unknown')}</div>
            <div class="strip-card-stats">♥ ${p.like_count} · 💬 ${p.comment_count}</div>
          </div>
        </div>
      `).join('');
    })
    .catch(() => {
      document.getElementById('hero-title').textContent = 'Edit Wall';
      document.getElementById('hero-meta').textContent = 'tap to check it out';
      document.getElementById('strip-row').innerHTML = '';
    });

  // ── Continue Editing mini list (reuses the same localStorage data as the Resources page) ──
  (function loadContinueEditingMini() {
    try {
      const viewed = JSON.parse(localStorage.getItem('hunnids_recently_viewed')) || [];
      const list = document.getElementById('ce-mini-list');
      if (viewed.length === 0) return;
      list.innerHTML = viewed.slice(0, 5).map(item => `
        <div class="ce-mini-row">
          <span class="ce-mini-badge">${escapeHtml(item.type || '')}</span>
          <span class="ce-mini-title">${escapeHtml((item.meta && item.meta.title) || item.id)}</span>
        </div>
      `).join('');
    } catch (e) {}
  })();

  // ── Join the Server (Discord widget) ──
  (function loadDiscordWidget() {
    const el = document.getElementById('discord-widget-hub');
    const inviteFallback = 'https://discord.gg/AcuUU2zpdD';
    fetch('https://discord.com/api/guilds/1220589442775908372/widget.json')
      .then(r => r.json())
      .then(data => {
        const inviteUrl = data.instant_invite || inviteFallback;
        const online = data.presence_count ?? '—';
        const avatars = (data.members || []).slice(0, 5).map(m =>
          `<img src="${m.avatar_url}" alt="" title="${m.username}" style="width:26px; height:26px; border-radius:50%; border:2px solid var(--bg-card); margin-left:-8px; box-shadow: var(--shadow-soft);" />`
        ).join('');
        el.innerHTML = `
          <div class="discord-online-row">
            <span style="width:7px;height:7px;border-radius:50%;background:#3ba55c;box-shadow:0 0 6px #3ba55c;"></span>
            <span style="font-weight:700; font-size:13px;">${online} online</span>
          </div>
          ${avatars ? `<div style="display:flex; padding-left:8px; margin-top:6px;">${avatars}</div>` : ''}
          <a class="discord-btn" href="${inviteUrl}" target="_blank">Join Discord ↗</a>
        `;
        document.getElementById('pill-online').textContent = online;
      })
      .catch(() => {
        el.innerHTML = `<a class="discord-btn" href="${inviteFallback}" target="_blank">Join Discord ↗</a>`;
      });
  })();

  // ── Tip of the Day ──
  const TIPS = [
    "<strong>Use proxies.</strong> If AE is running slow, create proxy files for your heavy footage.",
    "<strong>Pre-compose often.</strong> Keep your layer stack organized so you don't lose track of effects.",
    "<strong>Cache your previews.</strong> RAM preview before rendering to catch mistakes early.",
    "<strong>Name your layers.</strong> Future-you will thank present-you when revisiting a project.",
    "<strong>Save incrementally.</strong> Ctrl/Cmd+Shift+S every so often - version history is a lifesaver.",
  ];
  document.getElementById('tip-text').innerHTML = TIPS[Math.floor(Date.now() / 86400000) % TIPS.length];
</script>

<script src="resources.js"></script>

<script>
  (function loadFeaturedPlugin() {
    try {
      const featured = (typeof resources !== 'undefined' ? resources : []).filter(r => r.featured);
      const pick = featured[Math.floor(Date.now() / 86400000) % (featured.length || 1)];
      const card = document.getElementById('plugin-card');
      if (pick) {
        document.getElementById('plugin-name').textContent = pick.name;
        document.getElementById('plugin-text').textContent = pick.desc || 'tap to view →';
        if (pick.link) {
          card.href = pick.link;
          card.target = '_blank';
        }
      } else {
        document.getElementById('plugin-name').textContent = 'Browse Resources';
        document.getElementById('plugin-text').textContent = 'plugins, extensions, and more →';
      }
    } catch (e) {
      document.getElementById('plugin-name').textContent = 'Browse Resources';
      document.getElementById('plugin-text').textContent = 'plugins, extensions, and more →';
    }

    try {
      const pluginCount = (typeof resources !== 'undefined' ? resources : []).length;
      document.getElementById('pill-plugins').textContent = pluginCount;
      const tutorialCount = typeof tutorials !== 'undefined' ? tutorials.length : (typeof guides !== 'undefined' ? guides.length : '—');
      document.getElementById('pill-tutorials').textContent = tutorialCount;
    } catch (e) {}
  })();
</script>
