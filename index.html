<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/hunnids%20shape%20files/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/hunnids%20shape%20files/favicon-180.png">
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "41faa7d6bbb0425a99de71b7d1bb3deb"}'></script><!-- End Cloudflare Web Analytics -->
  <title>hunnids*</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #eef1f5;
      --bg-card: rgba(255,255,255,0.6);
      --bg-hover: rgba(255,255,255,0.85);
      --border: rgba(255,255,255,0.55);
      --border-hover: rgba(140,150,165,0.35);
      --text-primary: #2c313a;
      --text-secondary: #6b7280;
      --text-muted: #a4acb8;
      --brown: #3a3f4a;
      --brown-dim: #21242c;
      --brown-light: #707a8a;
      --shadow-soft: 0 8px 30px rgba(40,45,60,0.08);
      --shadow-pop: 0 14px 40px rgba(40,45,60,0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--border-hover) transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(173,196,230,0.55) 0%, transparent 45%),
        radial-gradient(circle at 88% 18%, rgba(210,190,230,0.40) 0%, transparent 45%),
        radial-gradient(circle at 30% 85%, rgba(180,220,215,0.40) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(230,200,200,0.30) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }
    body.dark-mode {
      --bg: #0f1117;
      --bg-card: rgba(22,27,40,0.75);
      --bg-hover: rgba(30,36,54,0.9);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.15);
      --text-primary: #e8eaf0;
      --text-secondary: #8892a4;
      --text-muted: #4a5268;
      --brown: #8ba0c4;
      --brown-dim: #c4d4f0;
      --brown-light: #5a7aaa;
      --shadow-soft: 0 8px 30px rgba(0,0,0,0.3);
      --shadow-pop: 0 14px 40px rgba(0,0,0,0.5);
    }

    header {
      position: sticky; top: 0; background: var(--bg);
      backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid var(--border);
      padding: 0 48px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; box-shadow: var(--shadow-soft);
    }
    body.dark-mode header { background: rgba(12,15,26,0.88); }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .brand { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 17px; color: var(--brown-dim); text-decoration: none; }
    .brand span { color: var(--brown-light); }
    .nav-tabs { display: flex; align-items: center; gap: 4px; }
    .tab {
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px;
      color: var(--text-secondary); text-decoration: none; padding: 7px 14px; border-radius: 16px;
      transition: all 0.15s;
    }
    .tab:hover { background: var(--bg-hover); color: var(--brown-dim); }
    .tab.active { background: var(--bg-hover); color: var(--brown-dim); }
    .tab.discord-cta { color: #5865F2; border: 1.5px solid #5865F2; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .dark-toggle {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border-hover); background: rgba(255,255,255,0.5);
      color: var(--brown-dim); cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s;
      position: relative; overflow: visible;
    }
    .dark-toggle:hover { background: rgba(255,255,255,0.9); transform: scale(1.08); }
    body.dark-mode .dark-toggle { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }

    .hub-wrap { max-width: 980px; margin: 0 auto; padding: 44px 24px 90px; }
    .hub-greeting { font-family: 'Quicksand', sans-serif; font-size: 30px; font-weight: 700; color: var(--brown-dim); margin-bottom: 4px; }
    .hub-greeting span { color: var(--brown-light); }
    .hub-sub { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 28px; }

    .widget-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 108px;
      gap: 16px;
    }
    @media (max-width: 700px) {
      .widget-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 100px; }
      .span-2 { grid-column: span 2 !important; }
    }

    .w-card {
      border-radius: 22px; background: var(--bg-card); backdrop-filter: blur(14px) saturate(150%);
      border: 1px solid var(--border); box-shadow: var(--shadow-soft);
      padding: 16px; display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .w-card.clickable { cursor: pointer; }
    .w-card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow-pop); }
    .w-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--brown-light);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; flex-shrink: 0;
    }

    /* icon launcher tiles */
    .w-icon-tile { align-items: center; justify-content: center; gap: 6px; text-align: center; }
    .w-icon-tile .icon-emoji { font-size: 26px; }
    .w-icon-tile .icon-label { font-size: 11.5px; font-weight: 700; color: var(--text-primary); }

    /* editor spotlight (2x2) */
    .spotlight-card { grid-column: span 2; grid-row: span 2; padding: 0; position: relative; }
    .spotlight-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
    .spotlight-overlay {
      position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
      justify-content: space-between; padding: 14px; background: linear-gradient(to top, rgba(0,0,0,0.65), transparent 60%);
    }
    .spotlight-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.8); letter-spacing: 1px; text-transform: uppercase; }
    .spotlight-user { color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    .spotlight-sub { color: rgba(255,255,255,0.85); font-size: 11px; font-family: 'JetBrains Mono', monospace; }

    /* join the server (2x1) */
    .discord-card { grid-column: span 2; justify-content: center; gap: 8px; }
    .discord-online-row { display: flex; align-items: center; gap: 8px; }
    .discord-btn {
      margin-top: 4px; text-align: center; padding: 8px; border-radius: 12px; background: #5865F2;
      color: #fff; font-weight: 700; font-size: 12.5px; text-decoration: none;
    }

    /* tip of day + featured plugin (2x1) */
    .tip-card, .plugin-card { grid-column: span 2; justify-content: center; }
    .tip-text, .plugin-text { font-size: 12.5px; color: var(--text-primary); }
    .plugin-name { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }

    @media (max-width: 768px) {
      header { padding: 0 20px; }
      .nav-tabs { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="brand" href="index.html">hunnids<span>*</span></a>
    <div class="nav-tabs">
      <a class="tab active" href="index.html">Home</a>
      <a class="tab" href="resources.html">Resources</a>
      <a class="tab" href="art-wall.html">Art Wall</a>
      <a class="tab" href="edit-wall.html">Edit Wall</a>
      <a class="tab discord-cta" href="https://discord.gg/AcuUU2zpdD" target="_blank">Join Discord ↗</a>
    </div>
  </div>
  <div class="header-right">
    <button class="dark-toggle" onclick="toggleDark()" id="dark-toggle" title="Toggle dark mode">
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5A8.5 8.5 0 1 1 11.5 4a6.5 6.5 0 0 0 8.5 8.5z"/></svg>
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>
    </button>
    <button class="dark-toggle" onclick="toggleMusic()" id="music-toggle" title="Now playing">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
    </button>
  </div>
</header>

<div class="hub-wrap">
  <div class="hub-greeting">Welcome back<span>*</span></div>
  <div class="hub-sub">Everything hunnids, all in one place.</div>

  <div class="widget-grid">
    <!-- Editor Spotlight -->
    <a class="w-card clickable spotlight-card" href="edit-wall.html" id="spotlight-card">
      <div class="spotlight-overlay">
        <span class="spotlight-label">// editor spotlight</span>
        <div>
          <div class="spotlight-user" id="spotlight-user">loading...</div>
          <div class="spotlight-sub" id="spotlight-sub"></div>
        </div>
      </div>
    </a>

    <!-- Join the Server -->
    <div class="w-card discord-card span-2">
      <span class="w-label">// join the server</span>
      <div id="discord-widget-hub">
        <div class="discord-online-row"><span style="width:7px;height:7px;border-radius:50%;background:var(--text-muted);"></span> loading...</div>
      </div>
    </div>

    <!-- Icon launchers -->
    <a class="w-card clickable w-icon-tile" href="edit-wall.html">
      <span class="icon-emoji">✏️</span><span class="icon-label">Edit Wall</span>
    </a>
    <a class="w-card clickable w-icon-tile" href="art-wall.html">
      <span class="icon-emoji">🖼️</span><span class="icon-label">Art Wall</span>
    </a>
    <a class="w-card clickable w-icon-tile" href="tutorials.html">
      <span class="icon-emoji">🎬</span><span class="icon-label">Tutorials</span>
    </a>
    <a class="w-card clickable w-icon-tile" href="resources.html">
      <span class="icon-emoji">🔌</span><span class="icon-label">Resources</span>
    </a>

    <!-- Tip of the Day -->
    <div class="w-card tip-card span-2">
      <span class="w-label">// tip of the day</span>
      <div class="tip-text" id="tip-text">Loading...</div>
    </div>

    <!-- Featured Plugin -->
    <a class="w-card clickable plugin-card span-2" href="resources.html" id="plugin-card">
      <span class="w-label">// featured plugin</span>
      <div class="plugin-name" id="plugin-name">Loading...</div>
      <div class="plugin-text" id="plugin-text"></div>
    </a>
  </div>
</div>

<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('hunnids-theme', isDark ? 'dark' : 'light');
    setThemeIcon(isDark);
  }
  function setThemeIcon(isDark) {
    const btn = document.getElementById('dark-toggle');
    if (!btn) return;
    btn.querySelector('.theme-icon--moon').style.display = isDark ? 'none' : 'block';
    btn.querySelector('.theme-icon--sun').style.display = isDark ? 'block' : 'none';
  }
  if (localStorage.getItem('hunnids-theme') === 'dark') {
    document.body.classList.add('dark-mode');
    setThemeIcon(true);
  }
  function toggleMusic() {
    if (window.HunnidsMiniplayer) window.HunnidsMiniplayer.toggle();
  }

  const API_BASE = 'https://hunnids-discord-bot.onrender.com';

  // ── Editor Spotlight: most recent Edit Wall post ──
  fetch(`${API_BASE}/api/posts?offset=0`)
    .then(r => r.json())
    .then(data => {
      const post = (data.posts || [])[0];
      const card = document.getElementById('spotlight-card');
      if (!post) {
        document.getElementById('spotlight-user').textContent = 'Nothing posted yet';
        document.getElementById('spotlight-sub').textContent = 'be the first on the Edit Wall';
        return;
      }
      card.style.backgroundImage = `url(${post.image_url})`;
      card.style.backgroundSize = 'cover';
      card.style.backgroundPosition = 'center';
      document.getElementById('spotlight-user').textContent = post.username || 'unknown';
      document.getElementById('spotlight-sub').textContent = `♥ ${post.like_count} · view on Edit Wall →`;
    })
    .catch(() => {
      document.getElementById('spotlight-user').textContent = 'Edit Wall';
      document.getElementById('spotlight-sub').textContent = 'tap to check it out →';
    });

  // ── Join the Server (Discord widget) ──
  (function loadDiscordWidget() {
    const el = document.getElementById('discord-widget-hub');
    const inviteFallback = 'https://discord.gg/AcuUU2zpdD';
    fetch('https://discord.com/api/guilds/1220589442775908372/widget.json')
      .then(r => r.json())
      .then(data => {
        const inviteUrl = data.instant_invite || inviteFallback;
        const online = data.presence_count ?? '—';
        el.innerHTML = `
          <div class="discord-online-row">
            <span style="width:7px;height:7px;border-radius:50%;background:#3ba55c;box-shadow:0 0 6px #3ba55c;"></span>
            <span style="font-weight:700; font-size:13px;">${online} online</span>
          </div>
          <a class="discord-btn" href="${inviteUrl}" target="_blank">Join Discord ↗</a>
        `;
      })
      .catch(() => {
        el.innerHTML = `<a class="discord-btn" href="${inviteFallback}" target="_blank">Join Discord ↗</a>`;
      });
  })();

  // ── Tip of the Day (rotates by day, so it's consistent across a visit but changes daily) ──
  const TIPS = [
    "<strong>Use proxies.</strong> If AE is running slow, create proxy files for your heavy footage.",
    "<strong>Pre-compose often.</strong> Keep your layer stack organized so you don't lose track of effects.",
    "<strong>Cache your previews.</strong> RAM preview before rendering to catch mistakes early.",
    "<strong>Name your layers.</strong> Future-you will thank present-you when revisiting a project.",
    "<strong>Save incrementally.</strong> Ctrl/Cmd+Shift+S every so often - version history is a lifesaver.",
  ];
  const dayIndex = Math.floor(Date.now() / 86400000) % TIPS.length;
  document.getElementById('tip-text').innerHTML = TIPS[dayIndex];
</script>

<script src="resources.js"></script>
<script>
  (function loadFeaturedPlugin() {
    try {
      const featured = (typeof resources !== 'undefined' ? resources : []).filter(r => r.featured);
      const pick = featured[Math.floor(Date.now() / 86400000) % (featured.length || 1)];
      if (pick) {
        document.getElementById('plugin-name').textContent = pick.name;
        document.getElementById('plugin-text').textContent = 'tap to browse resources →';
      } else {
        document.getElementById('plugin-name').textContent = 'Browse Resources';
        document.getElementById('plugin-text').textContent = 'plugins, extensions, and more →';
      }
    } catch (e) {
      document.getElementById('plugin-name').textContent = 'Browse Resources';
      document.getElementById('plugin-text').textContent = 'plugins, extensions, and more →';
    }
  })();
</script>

<script src="sounds.js"></script>
<script src="music.js"></script>
<script src="miniplayer.js"></script>
<script src="cursor.js"></script>
</body>
</html>
