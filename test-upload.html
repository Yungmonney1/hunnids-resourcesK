<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>hunnids* / upload test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 18px; }
  input, button, textarea { font-size: 14px; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  button { cursor: pointer; }
  #status { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #f2f2f2; padding: 10px; border-radius: 6px; }
  #preview { max-width: 100%; margin-top: 12px; border-radius: 8px; display: none; }
</style>
</head>
<body>

<h1>R2 upload pipeline test</h1>
<p>This is a throwaway test page - delete it once Phase 0 is confirmed working.</p>

<label>Bot API base URL</label>
<input id="api-base" value="https://hunnids-discord-bot.onrender.com" />

<label>Your login token (auto-filled if you're logged into hunnids.cc in this browser)</label>
<textarea id="token" rows="2"></textarea>

<label>Pick an image to upload</label>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" />

<button id="upload-btn">Upload</button>

<div id="status"></div>
<img id="preview" />

<script>
  const tokenEl = document.getElementById('token');
  const stored = localStorage.getItem('hunnids_token');
  if (stored) tokenEl.value = stored;

  const statusEl = document.getElementById('status');
  function log(msg) { statusEl.textContent += msg + '\n'; }

  document.getElementById('upload-btn').addEventListener('click', async () => {
    statusEl.textContent = '';
    document.getElementById('preview').style.display = 'none';

    const apiBase = document.getElementById('api-base').value.trim();
    const token = tokenEl.value.trim();
    const file = document.getElementById('file-input').files[0];

    if (!token) return log('Paste your login token first.');
    if (!file) return log('Pick a file first.');

    try {
      log('1. Asking backend for a signed upload...');
      const presignRes = await fetch(`${apiBase}/api/uploads/presign`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ content_type: file.type }),
      });
      const presignData = await presignRes.json();
      log('   -> ' + JSON.stringify(presignData, null, 2));
      if (!presignRes.ok) return log('FAILED at presign step - see error above.');

      log('\n2. Uploading file directly to R2...');
      const formData = new FormData();
      Object.entries(presignData.fields).forEach(([k, v]) => formData.append(k, v));
      formData.append('file', file);

      const uploadRes = await fetch(presignData.url, { method: 'POST', body: formData });
      log(`   -> R2 responded with status ${uploadRes.status}`);
      if (!uploadRes.ok) {
        const text = await uploadRes.text();
        log('FAILED at R2 upload step:\n' + text);
        return;
      }

      log('\n3. Done! Public URL:\n' + presignData.public_url);
      const img = document.getElementById('preview');
      img.src = presignData.public_url;
      img.style.display = 'block';
    } catch (err) {
      log('Unexpected error: ' + err.message);
    }
  });
</script>

</body>
</html>
